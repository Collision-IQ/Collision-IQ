name: test

# Runs the full suite on every pull request to main and on every push to it.
# Require the "npm test" check in main's branch protection so a red suite
# cannot merge (and so cannot reach production, which deploys on push to main).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway Postgres for the *.db.test.ts suites, which skip without
    # TEST_DATABASE_URL. It lives only for this job; no real data, no secrets.
    services:
      postgres:
        # pgvector ships in this image; the RAG tables use the vector type.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collision_iq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collision_iq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrate the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm test
      # The suite regenerates tests/fixtures/zip; a diff means the committed
      # fixtures are stale or the generator stopped being deterministic.
      - name: Working tree is clean after the suite
        run: git diff --exit-code
