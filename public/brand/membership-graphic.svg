<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0f1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Header -->
  <text x="40" y="50" font-size="14" font-weight="600" fill="#ff6b35" letter-spacing="2" text-transform="uppercase">Collision iQ Memberships · Now Open</text>

  <!-- Main Headline -->
  <text x="40" y="120" font-size="56" font-weight="700" fill="white">30 days of Pro.</text>
  <text x="40" y="180" font-size="56" font-weight="700" fill="white"><tspan fill="#ff6b35">Free, at</tspan></text>
  <text x="40" y="240" font-size="56" font-weight="700" fill="white"><tspan fill="#ff6b35">sign-up.</tspan></text>

  <!-- Subheading -->
  <text x="40" y="280" font-size="16" fill="#b0b0b0" font-family="Arial, sans-serif">One-time offer. Every new account gets the full system for a month. Then pick the plan</text>
  <text x="40" y="305" font-size="16" fill="#b0b0b0" font-family="Arial, sans-serif">that fits how many files you fight.</text>

  <!-- Pricing Cards Container -->
  <g id="cards">
    <!-- FREE Card -->
    <rect x="40" y="340" width="220" height="200" rx="12" fill="#1a1f2e" stroke="#404050" stroke-width="1"/>
    <text x="60" y="370" font-size="18" font-weight="700" fill="white">FREE</text>
    <text x="60" y="395" font-size="24" font-weight="700" fill="white">$0</text>
    <text x="60" y="430" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• Quick-answer chat</text>
    <text x="60" y="455" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• Read aloud</text>
    <text x="60" y="480" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• History & Knowledge Base</text>
    <text x="60" y="505" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• 5 uploads a month</text>
    <text x="60" y="530" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• 3 image generations a month</text>

    <!-- STARTER Card -->
    <rect x="290" y="340" width="220" height="200" rx="12" fill="#1a1f2e" stroke="#404050" stroke-width="1"/>
    <text x="310" y="370" font-size="18" font-weight="700" fill="white">STARTER</text>
    <text x="310" y="395" font-size="24" font-weight="700" fill="white">$50 <tspan font-size="16" fill="#a0a0a0">/mo</tspan></text>
    <text x="310" y="430" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• Quick chat + Research</text>
    <text x="310" y="455" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• 15 uploads a month</text>
    <text x="310" y="480" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• 10 image generations a month</text>
    <text x="310" y="505" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• Scan iQ</text>
    <text x="310" y="530" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• Snapshot customer report</text>

    <!-- PRO Card (Featured) -->
    <rect x="540" y="340" width="220" height="200" rx="12" fill="#1a1f2e" stroke="#ff6b35" stroke-width="2"/>
    <rect x="580" y="330" width="140" height="28" rx="6" fill="#ff6b35"/>
    <text x="650" y="352" font-size="11" font-weight="700" fill="black" text-anchor="middle" letter-spacing="1">EVERYTHING UNLOCKED</text>
    <text x="560" y="370" font-size="18" font-weight="700" fill="white">PRO</text>
    <text x="560" y="395" font-size="24" font-weight="700" fill="white">$200 <tspan font-size="16" fill="#a0a0a0">/mo</tspan></text>
    <text x="560" y="430" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• All features, all reports</text>
    <text x="560" y="455" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• Full report set</text>
    <text x="560" y="480" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• CCC Secure Share import</text>
    <text x="560" y="505" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• 35 uploads a month</text>
    <text x="560" y="530" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">• 10% off other apps & services</text>
  </g>

  <!-- Value IQ Note -->
  <text x="40" y="570" font-size="13" fill="#a0a0a0" font-family="Arial, sans-serif">Value iQ (ACV + diminished value) is pay-per-report and open to everyone. Enterprise coming soon.</text>

  <!-- Footer -->
  <text x="40" y="598" font-size="14" font-weight="600" fill="#666666">collision-iq.ai</text>
  <text x="720" y="598" font-size="12" fill="#666666" text-anchor="end">Every figure traces to the document.</text>
</svg>
